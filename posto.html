<style>
:root{--red:#D90D36;--orange:#F26A10;--burgundy:#7D0A20;--charcoal:#2B2F33;--bg:#FBF8F5;--fg:#1E2226;--muted:#5F666D;--card:#FFFFFF;--line:#ECE7E1;
  --sans:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15181B;--fg:#ECEEF0;--muted:#A7AEB5;--card:#1F2327;--line:#30363C}}
:root[data-theme="dark"]{--bg:#15181B;--fg:#ECEEF0;--muted:#A7AEB5;--card:#1F2327;--line:#30363C}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);line-height:1.4}
.top{background:#fff;border-bottom:3px solid var(--red);display:flex;align-items:center;gap:10px;padding:12px max(16px,env(safe-area-inset-left,0px));position:sticky;top:0;z-index:2}
.top img{height:28px;width:auto}
.ob{display:flex;align-items:center;gap:6px;margin-left:auto;font-family:var(--cond);font-weight:800;font-size:22px;color:#2B2F33}
.ob b{color:var(--red)}
main{max-width:520px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left,0px)) 40px;display:flex;flex-direction:column;gap:14px}
.hi{font-size:15px;color:var(--muted)}.hi b{color:var(--fg)}
.trip{font-family:var(--cond);font-size:30px;line-height:1.02;text-transform:uppercase;font-weight:800;margin:0;text-wrap:balance}
.date{font-size:15px;color:var(--muted);margin-top:3px}
.big{background:var(--red);color:#fff;border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:14px;box-shadow:0 10px 24px rgba(217,13,54,.28)}
.big .n{white-space:nowrap;font-family:var(--cond);font-size:44px;line-height:1;font-weight:800}
.big .l{font-size:13.5px;line-height:1.3}.big .l b{display:block;font-size:15px}
.busbox{background:var(--card);border-radius:20px;padding:12px 8px 14px;border:1px solid var(--line)}
.busbox .cap{text-align:center;font-size:13px;color:var(--muted);margin-bottom:4px}
.busbox svg{display:block;margin:0 auto;max-width:100%;height:auto}
.decks{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.info{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ic{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:13px;color:var(--muted);min-width:0}
.ic b{display:block;color:var(--fg);font-size:15.5px;overflow-wrap:anywhere}
.ic a{color:var(--red);font-weight:700;text-decoration:none}
.ic.w{grid-column:1/-1}
.cta{display:flex;flex-direction:column;gap:8px}
.cta a,.cta button{display:flex;justify-content:center;align-items:center;gap:8px;border-radius:14px;padding:13px;font:700 16px var(--sans);text-decoration:none;cursor:pointer;border:0;min-height:48px}
.cta .p{background:var(--charcoal);color:#fff}
.cta .s{background:var(--card);color:var(--fg);border:1px solid var(--line)}
.note{font-size:14px;background:#FFF0D1;color:#6b4300;border-radius:12px;padding:10px 12px;white-space:pre-line}
.foot{font-size:12.5px;color:var(--muted);text-align:center}
.foot a{color:inherit}
.err{background:var(--card);border-radius:16px;padding:20px;text-align:center;color:var(--muted)}
/* animazioni */
.bus-shell{animation:busIn .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes busIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
.st{opacity:0;animation:pop .35s ease-out both;transform-box:fill-box;transform-origin:center}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
.mine .seatbg{animation:glow 1.4s ease-in-out infinite;animation-delay:2.2s}
@keyframes glow{50%{fill:#FF4F72}}
.ring{fill:none;stroke:var(--red);stroke-width:3;opacity:0;transform-box:fill-box;transform-origin:center;animation:ring 1.6s ease-out infinite;animation-delay:2s}
@keyframes ring{0%{opacity:.85;transform:scale(.7)}100%{opacity:0;transform:scale(1.8)}}
.pin{opacity:0;animation:pinIn .5s cubic-bezier(.2,1.4,.4,1) both;animation-delay:1.8s}
@keyframes pinIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.st,.bus-shell,.pin{animation:none;opacity:1}.ring{display:none}.mine .seatbg{animation:none}}
</style>

    const shell = `<path d="M${pad},54 Q${pad},18 ${W / 2},14 Q${W - pad},18 ${W - pad},54 L${W - pad},${H - 10} Q${W - pad},${H} ${W - pad - 10},${H} L${pad + 10},${H} Q${pad},${H} ${pad},${H - 10} Z" fill="#fff" stroke="#2B2F33" stroke-width="2.5"/><path d="M${pad + 18},30 Q${W / 2},18 ${W - pad - 18},30" fill="none" stroke="#9fb4c8" stroke-width="5" stroke-linecap="round" opacity=".6"/><rect x="${xs[2]}" y="56" width="${colW[2]}" height="${H - 72}" fill="#F1EFEB"/><text x="${W / 2}" y="44" text-anchor="middle" font-family="Barlow Condensed,Arial" font-weight="700" font-size="11" letter-spacing="2" fill="#6b7076">${fi === 0 ? 'DAVANTI' : 'PIANO SOPRA'}</text>`;
    const pin = pinXY ? `<g class="pin"><rect x="${Math.max(4, pinXY.x - 14)}" y="${pinXY.y - 24}" width="100" height="20" rx="10" fill="#2B2F33"/><text x="${Math.max(4, pinXY.x - 14) + 50}" y="${pinXY.y - 10}" text-anchor="middle" font-family="Barlow,Arial" font-weight="700" font-size="11.5" fill="#fff">${MINE.length > 1 ? 'Voi siete qui' : 'Tu sei qui'}</text></g>` : '';
    return `<svg viewBox="0 0 ${W + 12} ${H + 4}" width="${W + 12}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Piantina del pullman con ${MINE.length > 1 ? 'i posti' : 'il posto'} ${MINE.join(' e ')} evidenziat${MINE.length > 1 ? 'i' : 'o'}"><g class="bus-shell">${shell}${parts.join('')}</g>${pin}</svg>`;
  }
  const decks = L ? L.floors.map((fl, fi) => ({ fl, fi, has: fl.rows.some(row => row.some(c => { const k = ci(c); return k.t === 'seat' && MINE.includes(k.s); })) })) : [];
  const show = decks.filter(d => d.has).length ? decks.filter(d => d.has) : decks.slice(0, 1);
  const dataTxt = D.f && D.f !== D.d ? `dal ${fd(D.d)} al ${fd(D.f)}` : fd(D.d);
  const seatsTxt = MINE.length ? MINE.join(' · ') : '—';
  $m.innerHTML = `
    <div class="hi">Ciao <b>${esc(D.c || '')}</b>, ${MINE.length > 1 ? 'ecco i vostri posti' : MINE.length ? 'ecco il tuo posto' : 'ecco i dati del viaggio'}</div>
    <div><h1 class="trip">${esc(D.g)}</h1><div class="date">${esc(dataTxt)}</div></div>
    ${MINE.length ? `<div class="big"><span class="n">${esc(seatsTxt)}</span><span class="l"><b>${esc((D.n || []).join(', '))}</b>${esc(where())}</span></div>` : '<div class="note">Il posto sul pullman ti verrà comunicato a breve.</div>'}
    ${L && MINE.length ? `<div class="busbox"><div class="cap">${esc(D.b || 'Pullman')}</div><div class="decks">${show.map(d => deckSVG(d.fl, d.fi, 0)).join('')}</div></div>` : ''}
    <div class="info">
      <div class="ic w">Partenza<b>${esc(fd(D.d))}${D.po ? ', ore ' + esc(D.po) : ''}</b>${esc(D.pl || '')}</div>
      ${D.a ? `<div class="ic">Accompagnatore<b>${esc(D.a)}</b>${D.at ? `<a href="tel:${esc(String(D.at).replace(/[^\d+]/g, ''))}">${esc(D.at)}</a>` : ''}</div>` : ''}
      ${D.h ? `<div class="ic">Hotel<b>${esc(D.h)}</b></div>` : ''}
    </div>
    ${D.x ? `<div class="note">${esc(D.x)}</div>` : ''}
    <div class="cta">${D.r ? `<a class="p" href="${esc(D.r)}" target="_blank" rel="noopener">Apri il programma della gita</a>` : ''}<button class="s" id="cal" type="button">Aggiungi al calendario</button></div>
    <div class="foot">La Terra viaggi in pullman · <a href="tel:+390932626240">0932 626240</a> · <a href="https://www.laterra.it" target="_blank" rel="noopener">laterra.it</a></div>`;
  document.getElementById('cal').addEventListener('click', () => {
    const d = pd(D.d); const [hh, mm] = String(D.po || '08:00').split(/[:.]/).map(Number);
    const p2 = n => String(n).padStart(2, '0');
    const st = `${d.getFullYear()}${p2(d.getMonth() + 1)}${p2(d.getDate())}T${p2(hh || 8)}${p2(mm || 0)}00`;
    const e = D.f && D.f !== D.d ? pd(D.f) : d; const en = `${e.getFullYear()}${p2(e.getMonth() + 1)}${p2(e.getDate())}T${D.f && D.f !== D.d ? '220000' : '235900'}`;
    const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//La Terra//OnBoard//IT', 'BEGIN:VEVENT', `UID:${st}-${MINE.join('-')}@laterra.it`, `DTSTART:${st}`, `DTEND:${en}`, `SUMMARY:${D.g} (La Terra)`, `LOCATION:${(D.pl || '').replace(/[,;]/g, ' ')}`, `DESCRIPTION:Posto ${MINE.join(' e ')} - ${D.b || ''}${D.r ? ' - Programma: ' + D.r : ''}`, 'BEGIN:VALARM', 'TRIGGER:-PT12H', 'ACTION:DISPLAY', 'DESCRIPTION:Domani si parte!', 'END:VALARM', 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' })); a.download = 'gita-la-terra.ics'; document.body.appendChild(a); a.click(); a.remove();
  });
  document.title = `Il tuo posto · ${D.g} · La Terra OnBoard`;
})();
